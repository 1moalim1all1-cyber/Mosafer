name: بناء APK لمسافر

# يشتغل تلقائيًا مع أي push على main، أو يدويًا من تبويب Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تثبيت Flutter (على سيرفر GitHub، مش جهازك)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: توليد ملفات Gradle بأحدث نسخة متوافقة مع Flutter المثبتة
        # بنشيل ملفات الإعداد القديمة ونخلي Flutter نفسه يولّدها من جديد،
        # عشان نضمن توافق 100% مع نسخة Flutter اللي اتثبتت فوق - بدل ما
        # نفرض نسخ Gradle/Kotlin/AGP يدوية ممكن تتعارض مع مكتبات زي geolocator.
        run: |
          rm -f android/build.gradle.kts android/settings.gradle.kts android/app/build.gradle.kts
          rm -f android/gradle/wrapper/gradle-wrapper.properties
          flutter create --platforms=android --org com.mosafer .
          # نفرض applicationId/namespace ثابتين بغض النظر عن أي تخمين تاني،
          # عشان يفضلوا متطابقين مع اللي هتسجله في Firebase Console
          sed -i 's/applicationId = ".*"/applicationId = "com.mosafer.app"/' android/app/build.gradle.kts
          sed -i 's/namespace = ".*"/namespace = "com.mosafer.app"/' android/app/build.gradle.kts

      - name: تثبيت المكتبات
        run: flutter pub get

      - name: توليد ملفات الترجمة
        run: flutter gen-l10n

      - name: بناء APK
        run: flutter build apk --release

      - name: رفع الـ APK كـ Artifact قابل للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: mosafer-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
