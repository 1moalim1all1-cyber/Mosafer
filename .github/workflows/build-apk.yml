name: بناء APK لمسافر

# يشتغل تلقائيًا مع أي push على main، أو يدويًا من تبويب Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تثبيت Flutter (على سيرفر GitHub، مش جهازك)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: تثبيت المكتبات
        run: flutter pub get

      - name: توليد ملفات الترجمة
        run: flutter gen-l10n

      - name: بناء APK
        run: flutter build apk --release

      - name: رفع الـ APK كـ Artifact قابل للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: mosafer-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
