name: بناء تطبيق مسافر (APK)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: npm ci

      # بناء نسخة الويب بمسار جذر "/" (بدل مسار GitHub Pages)
      # عشان تشتغل صح جوه التطبيق
      - run: npm run build:app

      # نسخ آخر نسخة من الموقع جوه مشروع أندرويد
      - run: npx cap sync android

      - name: بناء ملف APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: رفع الـ APK كملف تحميل
        uses: actions/upload-artifact@v4
        with:
          name: mosafer-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
