name: Signed Android release
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Increasing Google Play version code
        required: true
      version_name:
        description: User-visible version name
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build:app
      - run: npx cap sync android
      - name: Build signed bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/mosafer-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          python3 - <<'PY'
          import base64, os
          with open(os.environ['ANDROID_KEYSTORE_PATH'], 'wb') as f:
              f.write(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          PY
          chmod +x gradlew
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: mosafer-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
