name: mosafer_app
description: "مسافر | Mosafer - منصة مشاركة الرحلات بين المحافظات المصرية"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---- State Management ----
  flutter_riverpod: ^2.5.1

  # ---- Routing ----
  go_router: ^14.2.0

  # ---- Firebase (Auth + Firestore + Functions + Messaging) ----
  # ملحوظة: تعمل مجانًا بالكامل على خطة Blaze طالما الاستخدام داخل الحصة المجانية الشهرية.
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4
  cloud_functions: ^5.0.4

  # ---- Cloudinary (تخزين الصور - مجاني بالكامل بدون بطاقة) ----
  http: ^1.2.2

  # ---- الخرائط (OpenStreetMap - مجاني 100% بدون أي بطاقة) ----
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # ---- الخطوط (Cairo / IBM Plex Sans Arabic) - مجانية من Google Fonts ----
  google_fonts: ^6.2.1

  # ---- تدويل اللغتين (ar/en) + RTL/LTR ----
  intl: ^0.19.0

  # ---- تخزين محلي (Offline-first) ----
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0

  # ---- أدوات مساعدة ----
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_dotenv: ^5.1.0
  equatable: ^2.0.5
  intl_phone_field: ^3.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true # لتفعيل ملفات .arb تلقائيًا (l10n)

  assets:
    - .env
    - assets/images/
    - assets/icons/
